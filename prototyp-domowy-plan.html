function e(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dateIso(d){const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())}
function shiftDay(iso,num){const [y,m,d]=iso.split('-').map(Number);const dt=new Date(y,m-1,d);dt.setDate(dt.getDate()+num);return dateIso(dt)}
function localDate(iso){const [y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d)}
function formatDate(iso,opts){return localDate(iso).toLocaleDateString('pl-PL',opts||{weekday:'long',day:'numeric',month:'long'})}
const today=dateIso(new Date());const yesterday=shiftDay(today,-1);const tomorrow=shiftDay(today,1);
function seed(){const tasks=[
{id:'t1',name:'Opróżnić zmywarkę',date:today,assigned:'a',recurrence:'Codziennie',done:false,created:today},
{id:'t2',name:'Wynieść śmieci',date:today,assigned:'m',recurrence:'',done:false,created:today},
{id:'t3',name:'Podlać rośliny',date:today,assigned:'a',recurrence:'Co tydzień',done:false,created:today},
{id:'t4',name:'Zamówić filtr do wody',date:today,assigned:'',recurrence:'',done:true,created:today,completedAt:new Date().toISOString(),completedBy:'m'},
{id:'t5',name:'Przygotować obiad',date:today,assigned:'m',recurrence:'Codziennie',done:false,created:today},
{id:'t6',name:'Odkurzyć salon',date:yesterday,assigned:'m',recurrence:'',done:false,created:yesterday},
{id:'t7',name:'Sprawdzić zapasy na weekend',date:tomorrow,assigned:'a',recurrence:'',done:false,created:today},
{id:'t8',name:'Zmienić pościel',date:tomorrow,assigned:'',recurrence:'Co tydzień',done:false,created:today}];
const shopping=[{id:'s1',name:'Pomidory',quantity:'4 szt.',category:'Warzywa i owoce',done:false},{id:'s2',name:'Banany',quantity:'1 kg',category:'Warzywa i owoce',done:false},{id:'s3',name:'Mleko',quantity:'2 l',category:'Nabiał',done:false},{id:'s4',name:'Jajka',quantity:'10 szt.',category:'Nabiał',done:true},{id:'s5',name:'Chleb',quantity:'1 szt.',category:'Pozostałe',done:false}];
const past=[];for(let i=7;i>0;i--){let d=shiftDay(today,-i);for(let k=0;k<5;k++)past.push({id:'h'+i+'_'+k,name:['Odkurzyć mieszkanie','Zrobić zakupy','Wyrzucić śmieci','Wstawić pranie','Przygotować obiad'][k],date:d,assigned:k%2?'m':'a',done:k<(i%3===0?3:i%2===0?4:5),archived:k>=(i%3===0?3:i%2===0?4:5),recurrence:'',created:d,completedAt:d+'T12:00:00',completedBy:k%2?'m':'a'})}
return {tasks:[...tasks,...past],shopping,theme:'light',autoCarry:false,nightMode:false,modal:null,filter:'all',selectedDay:today,memberFilter:'all',view:'today',history:[],version:1}}
function load(){try{const d=localStorage.getItem(KEY);if(d){const loaded=JSON.parse(d);if(loaded.version===1&&Array.isArray(loaded.tasks))return {...seed(),...loaded,modal:null,view:'today',selectedDay:today}}}catch(_){}return seed()}
let state=load();function save(){try{const {modal,...toSave}=state;localStorage.setItem(KEY,JSON.stringify(toSave))}catch(_){}}
if(state.autoCarry){state.tasks.forEach(t=>{if(t.date<today&&!t.done&&!t.recurrence&&!t.archived){t.originalDate=t.originalDate||t.date;t.date=today}});save()}
const members=[{id:'a',name:'Ania',role:'Domownik',initial:'A',color:'rose'},{id:'m',name:'Marek',role:'Domownik',initial:'M',color:'blue'}];
function getMember(id){return members.find(x=>x.id===id)}

function navBtn(view,label,icon){return `<button class="nav-item ${state.view===view?'active':''}" data-nav="${view}" aria-current="${state.view===view?'page':'false'}">${ico(icon)}<span>${label}</span>${view==='shopping'?`<b class="nav-count">${state.shopping.filter(x=>!x.done).length}</b>`:''}</button>`}
function dayTasks(date=state.selectedDay){return state.tasks.filter(t=>t.date===date)}

function overdue(){return state.tasks.filter(t=>t.date<today&&!t.done&&!t.recurrence&&!t.archived)}
function actTheme(){const hour=new Date().getHours();const dark=state.theme==='dark'||(state.theme==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)||(state.theme==='schedule'&&(hour>=20||hour<7));document.body.classList.toggle('dark',!!dark)}
function render(){actTheme();document.getElementById('app').innerHTML=`<div class="main-grid"><aside class="sidebar"><div class="brand"><div class="brand-symbol">${ico('check',25)}</div><div><strong>domowy plan</strong><span>Twoja codzienność</span></div></div><div><div class="menu-title">Przestrzeń domowa</div><nav class="nav-list" aria-label="Nawigacja">${navBtn('today','Dzisiaj','home')}${navBtn('planner','Plan tygodnia','calendar')}${navBtn('shopping','Zakupy','shopping')}${navBtn('household','Domownicy','users')}${navBtn('history','Historia','history')}${navBtn('settings','Ustawienia','settings')}</nav></div><div class="aside-card"><div class="eyebrow"><span class="status-dot"></span>Tryb demonstracyjny</div><p>Dane zapisują się tylko w tej przeglądarce. Synchronizacja między urządzeniami to element docelowego MVP.</p></div><div class="sidebar-footer">${avatar('a')}<div><div class="semibold small">Domowe konto</div><div class="tiny muted">Wspólna przestrzeń</div></div></div></aside><div class="content-wrap"><header class="topbar"><div class="topbar-left">${ico('home',16)} <span>Dom / ${e({today:'Dzisiaj',planner:'Plan tygodnia',shopping:'Zakupy',household:'Domownicy',history:'Historia',settings:'Ustawienia'}[state.view])}</span></div><div class="topbar-right"><span class="topbar-tag">${ico('info',14)} DEMO • lokalnie</span><button class="icon-btn mobile-settings" data-nav="settings" aria-label="Ustawienia">${ico('settings',19)}</button><button class="icon-btn" data-action="themeQuick" aria-label="Przełącz motyw">${ico(document.body.classList.contains('dark')?'sun':'moon',19)}</button></div></header><main class="main-content">${page()}</main></div></div><nav class="bottom-nav" aria-label="Nawigacja mobilna">${bottomBtn('today','Dzisiaj','home')}${bottomBtn('planner','Plan','calendar')}${bottomBtn('shopping','Zakupy','shopping')}${bottomBtn('household','Dom','users')}${bottomBtn('history','Historia','history')}</nav>${state.modal?modalHtml():''}<div id="toast-slot" aria-live="polite"></div>`}
function bottomBtn(view,label,icon){return `<button class="bottom-link ${state.view===view?'active':''}" data-nav="${view}">${ico(icon,20)}<span>${label}</span></button>`}
function page(){if(state.view==='today')return todayPage();if(state.view==='planner')return plannerPage();if(state.view==='shopping')return shoppingPage();if(state.view==='household')return householdPage();if(state.view==='history')return historyPage();return settingsPage()}
function heading(kicker,title,desc,action){return `<div class="page-head"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p class="subhead">${desc}</p></div>${action||''}</div>`}
function btn(label,action,icon,cls='primary'){return `<button class="button ${cls}" data-action="${action}">${icon?ico(icon,17):''}${label}</button>`}
function taskRow(t){const past=t.date<today&&!t.done;return `<div class="task-row"><button class="check ${t.done?'done':''}" data-task="${e(t.id)}" title="${t.done?'Cofnij wykonanie':'Odhacz zadanie'}" aria-label="${t.done?'Cofnij: ':'Wykonaj: '}${e(t.name)}">${t.done?ico('check',16):''}</button><div class="task-body"><div class="task-title ${t.done?'done':''}">${e(t.name)}</div><div class="task-meta">${t.recurrence?`${ico('repeat',12)} ${e(t.recurrence)}`:past?'<span style="color:var(--amber)">Zaległe</span>':'Jednorazowe'}${t.done?'<span class="sep">•</span>Wykonano':''}</div></div><div class="task-assignee">${avatar(t.assigned,true)}<span class="desktop-only">${e(getMember(t.assigned)?.name||'Wszyscy')}</span></div></div>`}
function todayPage(){const tasks=dayTasks(today);const pendingOverdue=overdue();const all=tasks.filter(t=>state.filter==='all'||(state.filter==='pending'&&!t.done)||(state.filter==='mine'&&t.assigned==='a'));const done=tasks.filter(t=>t.done).length;const p=Math.round(done/(tasks.length||1)*100);const previewShopping=state.shopping.filter(t=>!t.done).slice(0,4);return heading('CODZIENNY ORGANIZER', 'Dzień dobry! 👋',formatDate(today,{weekday:'long',day:'numeric',month:'long',year:'numeric'}),btn('Nowe zadanie','addTask','plus'))+`<div class="metric-grid"><div class="metric"><div class="metric-top">Postęp dzisiaj ${ico('check',15)}</div><div class="metric-figure">${done}<span class="smallnum"> / ${tasks.length}</span></div><div class="progress-track"><div class="progress-fill" style="width:${p}%"></div></div></div><div class="metric"><div class="metric-top">Pozostało do zrobienia ${ico('calendar',15)}</div><div class="metric-figure">${tasks.length-done}</div><div class="metric-note">Zaplanuj to na spokojnie</div></div><div class="metric"><div class="metric-top">Zaległe zadania ${ico('history',15)}</div><div class="metric-figure">${pendingOverdue.length}</div><div class="metric-note">Z poprzednich dni</div></div></div><div class="content-columns"><section><div class="card"><div class="card-inner" style="padding-bottom:8px"><div class="card-header"><h2 class="section-title">Zadania na dziś</h2><span class="pill">${tasks.length} zadań</span></div><div class="tabs"><button class="tab ${state.filter==='all'?'active':''}" data-filter="all">Wszystkie</button><button class="tab ${state.filter==='pending'?'active':''}" data-filter="pending">Do zrobienia</button><button class="tab ${state.filter==='mine'?'active':''}" data-filter="mine">Ani</button></div></div><div class="tasks-area">${all.length?all.map(taskRow).join(''):'<div class="task-empty">Brak zadań w tym widoku.</div>'}</div><form class="quick-add" id="quick-task">${ico('plus',18)}<input name="task" autocomplete="off" placeholder="Dodaj nowe zadanie…" required maxlength="140" aria-label="Nowe zadanie"><button type="submit">Dodaj</button></form></div></section><aside class="side-stack">${pendingOverdue.length?`<div class="overdue">${ico('alert',19)}<span>${pendingOverdue.length} zaległe ${pendingOverdue.length===1?'zadanie':'zadania'}</span><button data-action="carryOver">Przenieś na dziś →</button></div>`:''}<div class="card"><div class="card-inner"><div class="card-header"><h2 class="section-title">Lista zakupów</h2><button class="text-link" data-nav="shopping">Otwórz ${ico('arrow',14)}</button></div><ul class="mini-list">${previewShopping.map(i=>`<li><span class="mini-checkbox"></span><span>${e(i.name)}</span><span class="mini-qty">${e(i.quantity)}</span></li>`).join('')||'<li>Lista jest pusta</li>'}</ul><p class="mini-caption" style="margin-bottom:0">${state.shopping.filter(x=>!x.done).length} produktów do kupienia</p></div></div><div class="card"><div class="card-inner"><div class="card-header"><h2 class="section-title">Domownicy</h2><button class="text-link" data-nav="household">Zobacz ${ico('arrow',14)}</button></div>${members.map(m=>`<div class="member-mini">${avatar(m.id)}<span class="grow">${m.name}</span><span class="count">${tasks.filter(x=>x.assigned===m.id&&!x.done).length} do zrobienia</span></div>`).join('')}</div></div></aside></div>`}
function plannerPage(){const center=state.selectedDay;const weekStart=shiftDay(center,-((localDate(center).getDay()+6)%7));const ds=Array.from({length:7},(_,i)=>shiftDay(weekStart,i));const list=dayTasks(center);return heading('ZAPLANUJ TYDZIEŃ','Plan i powtarzalność','Zadania na wybrany dzień oraz reguły cykliczne.',btn('Dodaj zadanie','addTask','plus'))+`<div class="view-topline"><span class="semibold">${formatDate(weekStart,{month:'long',year:'numeric'})}</span><div class="date-nav"><button class="icon-btn" data-action="prevWeek" aria-label="Poprzedni tydzień">${ico('left')}</button><button class="button" data-action="resetDay">Dzisiaj</button><button class="icon-btn" data-action="nextWeek" aria-label="Następny tydzień">${ico('right')}</button></div></div><div class="week-strip">${ds.map(d=>`<button class="day-cell ${d===center?'selected':''}" data-date="${d}"><span class="day-name">${formatDate(d,{weekday:'short'})}</span><strong>${localDate(d).getDate()}</strong><i class="day-dot" style="opacity:${dayTasks(d).length?1:0}"></i></button>`).join('')}</div><div class="content-columns"><div class="card"><div class="card-inner"><div class="card-header"><h2 class="section-title">${formatDate(center,{weekday:'long',day:'numeric',month:'long'})}</h2><span class="pill">${list.length} zadań</span></div>${list.length?list.map(taskRow).join(''):'<p class="muted small">Na ten dzień nie ma jeszcze zadań. Dodaj pierwsze.</p>'}</div></div><div class="card"><div class="card-inner"><div class="card-header"><h2 class="section-title">Zadania cykliczne</h2>${ico('repeat',19)}</div>${[{name:'Opróżnić zmywarkę',rule:'Codziennie, rano'},{name:'Podlać rośliny',rule:'W każdą środę'},{name:'Zmienić pościel',rule:'Co tydzień'}].map(r=>`<div class="rule-row"><span class="rule-icon">${ico('repeat',17)}</span><div class="grow"><strong>${r.name}</strong><span>${r.rule}</span></div></div>`).join('')}<p class="mini-caption">W docelowym MVP reguła tworzy osobne wystąpienia na dany dzień, bez dublowania zadań.</p></div></div></div>`}
function shoppingPage(){const pending=state.shopping.filter(x=>!x.done);const groups=[...new Set(state.shopping.map(x=>x.category))];return heading('PRZED WYJŚCIEM Z DOMU','Lista zakupów','Wspólna lista produktów do kupienia.',btn('Dodaj produkt','addShopping','plus'))+`<div class="content-columns"><div><div class="shopping-head"><span class="chip green">${pending.length} do kupienia</span>${btn('Wyczyść kupione','clearShopping','check','ghost')}</div><form class="quick-add" id="quick-shopping" style="margin:0 0 15px;background:var(--panel);border:1px solid var(--line);padding:9px">${ico('plus',18)}<input name="item" autocomplete="off" placeholder="Np. masło, pomidory, herbata…" required maxlength="100"><button type="submit">Dodaj</button></form>${groups.map(g=>`<section class="shopping-group"><h3>${e(g)}</h3>${state.shopping.filter(i=>i.category===g).map(i=>`<div class="shopping-row"><button class="check ${i.done?'done':''}" data-shopping="${e(i.id)}" aria-label="${i.done?'Cofnij zakup: ':'Kupiono: '}${e(i.name)}">${i.done?ico('check',16):''}</button><span class="grow ${i.done?'done':''} semibold small">${e(i.name)}</span><small>${e(i.quantity)}</small></div>`).join('')}</section>`).join('')}</div><aside class="side-stack"><div class="card"><div class="card-inner"><div class="card-header"><h2 class="section-title">Zakupy w skrócie</h2>${ico('shopping',20)}</div><div class="metric-figure">${state.shopping.filter(x=>x.done).length}<span class="smallnum"> / ${state.shopping.length}</span></div><div class="progress-track"><div class="progress-fill" style="width:${Math.round(state.shopping.filter(x=>x.done).length/(state.shopping.length||1)*100)}%"></div></div><p class="mini-caption">Wszystkie urządzenia docelowo widzą ten sam stan listy.</p></div></div></aside></div>`}
function householdPage(){const mine=state.tasks.filter(t=>t.date===today);return heading('RAZEM ŁATWIEJ','Domownicy','Każde zadanie może mieć przypisaną osobę.',btn('Przypisz zadanie','addTask','plus'))+`<div class="profile-grid">${members.map(m=>{const assigned=mine.filter(t=>t.assigned===m.id);const done=assigned.filter(t=>t.done).length;return `<div class="profile-card"><div class="profile-header">${avatar(m.id)}<div><h3>${m.name}</h3><p>${m.role}</p></div></div><div class="profile-stat">${done} / ${assigned.length} <span>wykonanych dzisiaj</span></div><div class="progress-track"><div class="progress-fill" style="width:${Math.round(done/(assigned.length||1)*100)}%"></div></div><button class="button secondary" data-member="${m.id}">Pokaż zadania ${m.name}</button></div>`}).join('')}</div><div class="card" style="margin-top:18px"><div class="card-inner"><div class="card-header"><h2 class="section-title">Dzisiejszy podział obowiązków</h2><span class="chip">${state.memberFilter==='all'?'Wszyscy':e(getMember(state.memberFilter)?.name||'Wszyscy')}</span></div><div class="tabs" style="margin-bottom:9px"><button class="tab ${state.memberFilter==='all'?'active':''}" data-member="all">Wszyscy</button>${members.map(m=>`<button class="tab ${state.memberFilter===m.id?'active':''}" data-member="${m.id}">${m.name}</button>`).join('')}</div>${mine.filter(t=>state.memberFilter==='all'||t.assigned===state.memberFilter).map(taskRow).join('')||'<p class="muted small">Brak zadań dla tej osoby.</p>'}<div class="notice" style="margin-top:17px">${ico('info',17)}<span>W docelowej aplikacji każdy domownik ma osobne logowanie. Tablet może używać dedykowanego profilu „Kuchnia”.</span></div></div></div>`}
function historyPage(){const dates=Array.from({length:7},(_,i)=>shiftDay(today,i-6));const byDate=dates.map(d=>{const ts=dayTasks(d);return {date:d,done:ts.filter(x=>x.done).length,total:ts.length}});const completed=byDate.reduce((s,v)=>s+v.done,0);const total=byDate.reduce((s,v)=>s+v.total,0);const pct=Math.round(completed/(total||1)*100);const last=state.tasks.filter(x=>x.done).sort((a,b)=>(b.completedAt||'').localeCompare(a.completedAt||'')).slice(0,6);return heading('MAŁE KROKI, DUŻA RÓŻNICA','Historia i statystyki','Postęp domowników z ostatnich 7 dni. Dane przykładowe.',btn('Wróć do dziś','goToday','home','secondary'))+`<div class="metric-grid"><div class="metric"><div class="metric-top">Wykonane w 7 dni ${ico('check',15)}</div><div class="metric-figure">${completed}</div><div class="metric-note">Odhaczonych zadań</div></div><div class="metric"><div class="metric-top">Skuteczność ${ico('spark',15)}</div><div class="metric-figure">${pct}%</div><div class="metric-note">Wykonanych z zaplanowanych</div></div><div class="metric"><div class="metric-top">Dni z aktywnością ${ico('calendar',15)}</div><div class="metric-figure">${byDate.filter(x=>x.done>0).length}<span class="smallnum"> / 7</span></div><div class="metric-note">W ostatnim tygodniu</div></div></div><div class="content-columns"><div class="card"><div class="card-inner"><div class="card-header"><h2 class="section-title">Wykonane zadania</h2><span class="pill">Ostatnie 7 dni</span></div><div class="bar-chart">${byDate.map(d=>`<div class="bar-col" title="${e(formatDate(d.date))}: ${d.done} wykonane z ${d.total}"><div class="bar-track"><div class="bar-value" style="height:${d.total?100*d.done/d.total:0}%"></div></div><span class="bar-label">${formatDate(d.date,{weekday:'short'}).replace('.','')}</span></div>`).join('')}</div><p class="mini-caption">Wysokość słupka pokazuje odsetek wykonanych zadań danego dnia.</p></div></div><div class="card"><div class="card-inner"><div class="card-header"><h2 class="section-title">Ostatnia aktywność</h2>${ico('history',19)}</div>${last.map(t=>`<div class="activity-item"><span class="activity-icon">${ico('check',15)}</span><div><strong>${e(t.name)}</strong><p>${e(getMember(t.completedBy)?.name||'Domownicy')} · ${e(formatDate(t.date,{day:'numeric',month:'short'}))}</p></div></div>`).join('')||'<p class="muted small">Brak wykonanych zadań.</p>'}</div></div></div>`}
function settingsPage(){return heading('USTAW POD SIEBIE','Ustawienia','Wygląd urządzenia kuchennego i podstawowe zasady aplikacji.')+`<div class="card"><div class="card-inner"><h2 class="section-title">Wygląd</h2><div class="settings-row"><div><h3>Motyw interfejsu</h3><p>Jasny, ciemny, systemowy lub według pory dnia.</p></div><select id="theme-mode" aria-label="Tryb wyglądu"><option value="light" ${state.theme==='light'?'selected':''}>Jasny</option><option value="dark" ${state.theme==='dark'?'selected':''}>Ciemny</option><option value="auto" ${state.theme==='auto'?'selected':''}>Systemowy</option><option value="schedule" ${state.theme==='schedule'?'selected':''}>20:00–07:00</option></select></div><div class="settings-row"><div><h3>Automatyczne przenoszenie zaległych</h3><p>Jednorazowe, niewykonane zadania przechodzą na bieżący dzień.</p></div><button class="switch ${state.autoCarry?'on':''}" data-action="toggleCarry" role="switch" aria-checked="${state.autoCarry}" aria-label="Automatyczne przenoszenie zaległych"></button></div><div class="settings-row"><div><h3>Konto kuchenne</h3><p>Tablet używa osobnej sesji; domownicy własnych kont na telefonach.</p></div><span class="chip green">Plan MVP</span></div><div class="settings-row"><div><h3>Dane demonstracyjne</h3><p>Resetuje tylko ten prototyp w aktualnej przeglądarce.</p></div>${btn('Zresetuj','resetDemo','history','ghost')}</div></div></div><div class="notice" style="margin-top:18px">${ico('lock',17)}<span>Ten plik HTML to interaktywny projekt UX: niczego nie wysyła do internetu. Właściwa aplikacja PWA będzie wymagała wdrożenia hostingu, logowania i Firestore.</span></div>`}
function modalHtml(){const isShopping=state.modal==='shopping';return `<div class="modal-backdrop" data-action="backdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-header"><h2 id="modal-title">${isShopping?'Dodaj produkt':'Nowe zadanie'}</h2><button class="icon-btn" data-action="closeModal" aria-label="Zamknij">${ico('x',18)}</button></div><form id="modal-form"><div class="field"><label for="modal-name">${isShopping?'Nazwa produktu':'Nazwa zadania'}</label><input id="modal-name" name="name" required autocomplete="off" maxlength="140" placeholder="${isShopping?'Np. herbata':'Np. Posprzątać kuchnię'}" /></div>${isShopping?`<div class="field-grid"><div class="field"><label for="modal-qty">Ilość</label><input id="modal-qty" name="quantity" maxlength="30" placeholder="1 szt." /></div><div class="field"><label for="modal-category">Kategoria</label><select id="modal-category" name="category"><option>Warzywa i owoce</option><option>Nabiał</option><option>Pozostałe</option></select></div></div>`:`<div class="field-grid"><div class="field"><label for="modal-date">Data</label><input id="modal-date" name="date" type="date" value="${e(state.view==='planner'?state.selectedDay:today)}" required /></div><div class="field"><label for="modal-person">Wykonuje</label><select id="modal-person" name="assigned"><option value="">Wszyscy</option>${members.map(m=>`<option value="${m.id}">${m.name}</option>`).join('')}</select></div></div><div class="field"><label for="modal-rec">Powtarzanie</label><select id="modal-rec" name="recurrence"><option value="">Nie powtarzaj</option><option value="Codziennie">Codziennie</option><option value="Co tydzień">Co tydzień</option></select></div><div class="notice">${ico('info',16)}<span>W prototypie zapisuje się pojedyncze zadanie z oznaczeniem cykliczności. Automatyczne generowanie wystąpień jest częścią docelowej aplikacji.</span></div>`}<div class="modal-actions">${btn('Anuluj','closeModal',null,'ghost')}<button class="button primary" type="submit">${ico('plus',16)} Dodaj</button></div></form></div></div>`}
let toastTimeout;function toast(msg){const slot=document.getElementById('toast-slot');if(!slot)return;slot.innerHTML=`<div class="toast">${e(msg)}</div>`;clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>{if(slot)slot.innerHTML=''},2400)}
function changeView(id){state.view=id;state.modal=null;save();render();window.scrollTo(0,0)}
function doAction(a){if(a==='addTask'){state.modal='task';render();setTimeout(()=>document.getElementById('modal-name')?.focus(),0);return}if(a==='addShopping'){state.modal='shopping';render();setTimeout(()=>document.getElementById('modal-name')?.focus(),0);return}if(a==='closeModal'||a==='backdrop'){state.modal=null;render();return}if(a==='carryOver'){const n=overdue().length;state.tasks.forEach(t=>{if(t.date<today&&!t.done&&!t.recurrence&&!t.archived){t.originalDate=t.originalDate||t.date;t.date=today}});save();render();toast('Przeniesiono '+n+' zadań na dzisiaj');return}if(a==='themeQuick'){state.theme=document.body.classList.contains('dark')?'light':'dark';save();render();return}if(a==='prevWeek'||a==='nextWeek'){state.selectedDay=shiftDay(state.selectedDay,a==='prevWeek'?-7:7);save();render();return}if(a==='resetDay'){state.selectedDay=today;save();render();return}if(a==='goToday'){changeView('today');return}if(a==='clearShopping'){state.shopping=state.shopping.filter(x=>!x.done);save();render();toast('Usunięto kupione produkty');return}if(a==='toggleCarry'){state.autoCarry=!state.autoCarry;if(state.autoCarry){state.tasks.forEach(t=>{if(t.date<today&&!t.done&&!t.recurrence&&!t.archived){t.originalDate=t.originalDate||t.date;t.date=today}})}save();render();toast(state.autoCarry?'Automatyczne przenoszenie włączone':'Automatyczne przenoszenie wyłączone');return}if(a==='resetDemo'){if(confirm('Przywrócić przykładowe dane? Wszystkie zmiany w tym prototypie zostaną utracone.')){state=seed();save();render();toast('Przywrócono dane przykładowe')}return}}
function nextId(prefix){return prefix+Date.now().toString(36)+Math.floor(Math.random()*99999).toString(36)}
function addTask(name,attrs={}){state.tasks.push({id:nextId('t'),name,date:attrs.date||today,assigned:attrs.assigned||'',recurrence:attrs.recurrence||'',done:false,created:today});save();render();toast('Dodano zadanie')}
function addShopping(name,attrs={}){state.shopping.push({id:nextId('s'),name,quantity:attrs.quantity||'1 szt.',category:attrs.category||'Pozostałe',done:false});save();render();toast('Dodano do zakupów')}
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-nav],[data-action],[data-task],[data-shopping],[data-filter],[data-date],[data-member]');if(!el)return;if(el.hasAttribute('data-nav')){changeView(el.getAttribute('data-nav'));return}if(el.hasAttribute('data-task')){const t=state.tasks.find(x=>x.id===el.getAttribute('data-task'));if(t){t.done=!t.done;t.completedAt=t.done?new Date().toISOString():null;t.completedBy=t.done?'a':null;save();render()}return}if(el.hasAttribute('data-shopping')){const s=state.shopping.find(x=>x.id===el.getAttribute('data-shopping'));if(s){s.done=!s.done;save();render()}return}if(el.hasAttribute('data-filter')){state.filter=el.getAttribute('data-filter');save();render();return}if(el.hasAttribute('data-date')){state.selectedDay=el.getAttribute('data-date');save();render();return}if(el.hasAttribute('data-member')){state.memberFilter=el.getAttribute('data-member');state.view='household';save();render();return}if(el.hasAttribute('data-action')){if(el.getAttribute('data-action')==='backdrop'&&ev.target!==el)return;doAction(el.getAttribute('data-action'))}});
document.addEventListener('submit',ev=>{if(!['quick-task','quick-shopping','modal-form'].includes(ev.target.id))return;ev.preventDefault();const form=ev.target;const data=new FormData(form);if(form.id==='quick-task'){const n=String(data.get('task')||'').trim();if(n)addTask(n);return}if(form.id==='quick-shopping'){const n=String(data.get('item')||'').trim();if(n)addShopping(n);return}const n=String(data.get('name')||'').trim();if(!n)return;if(state.modal==='shopping')addShopping(n,{quantity:String(data.get('quantity')||''),category:String(data.get('category')||'Pozostałe')});else addTask(n,{date:String(data.get('date')||today),assigned:String(data.get('assigned')||''),recurrence:String(data.get('recurrence')||'')});state.modal=null;render()});
document.addEventListener('change',ev=>{if(ev.target.id==='theme-mode'){state.theme=ev.target.value;save();render()}});document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&state.modal){state.modal=null;render()}});render();setInterval(()=>{if(state.theme==='schedule')actTheme()},60000);
})();
</script>
</body>
</html>
